<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<title>¡Desactiva la bomba!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Onest:wght@500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#08080a;--fg:#f3f1ea;--surface:#111114;--line:rgba(243,241,234,.1);--line2:rgba(243,241,234,.22);--accent:#ff3b1d;--ok:#3dff9a;--d:"Anton",sans-serif;--s:"Onest",sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
html,body{height:100%;background:var(--bg);overscroll-behavior:none}
body{color:var(--fg);font-family:var(--s);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
#app{height:100dvh;max-width:640px;margin:auto;display:flex;flex-direction:column;gap:14px;padding:max(16px,env(safe-area-inset-top)) 16px max(18px,env(safe-area-inset-bottom))}
.top{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:16px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);border-radius:2px}
.top:after{content:"";position:absolute;top:0;bottom:0;left:-35%;width:35%;background:linear-gradient(90deg,transparent,rgba(255,59,29,.28),transparent);animation:streak .8s linear infinite}
@keyframes streak{to{left:100%}}
.dot{width:10px;height:10px;border-radius:9999px;background:var(--accent);animation:bl 1s steps(2) infinite}
.clock{font-family:var(--d);font-size:clamp(44px,13.5vw,84px);line-height:1;color:var(--accent);text-shadow:0 0 24px rgba(255,59,29,.6);white-space:nowrap;letter-spacing:.02em}
.clock span{display:inline-block;min-width:1.75ch;text-align:center;font-weight:400}.clock b{font-weight:400;opacity:.8}.clock .cc{opacity:.85}
@keyframes flick{0%{opacity:1}30%{opacity:.55}34%{opacity:1}70%{opacity:.7}74%{opacity:1}}
.dots{display:flex;justify-content:center;gap:12px}
.dots i{width:28px;height:4px;background:var(--line2);transition:background .3s,transform .3s var(--ease)}
.dots i.on{background:var(--accent);transform:scaleY(2)}
.grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px}
.grid.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-14px)}40%{transform:translateX(14px)}60%{transform:translateX(-9px)}80%{transform:translateX(9px)}}
.tile{display:grid;place-items:center;border:1px solid var(--line2);background:var(--surface);border-radius:2px;transition:transform .15s var(--ease),border-color .25s,background .25s}
.tile:active{transform:scale(.96);border-color:var(--accent)}
.tile svg{width:52%;height:52%;overflow:visible;fill:none;stroke:var(--fg);stroke-width:4;stroke-linejoin:round;transition:stroke .25s;animation:fl 3s ease-in-out infinite;animation-delay:var(--dl)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-5%)}}
.tile.hit{background:var(--accent);border-color:var(--accent)}
.tile.hit svg{stroke:var(--bg);animation:pop .5s var(--ease)}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
#flash{position:fixed;inset:0;background:var(--accent);opacity:0;pointer-events:none;z-index:50;transition:opacity .5s}
#flash.on{opacity:.5;transition:none}
.ov{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vw;overflow:hidden}
.ov.show{display:flex}
.ov.red{animation:redbg 1s steps(2) infinite}
@keyframes redbg{50%{background:#2a0803}}
.cd{font-family:var(--d);font-size:min(78vw,60vh);line-height:.9;color:var(--accent);animation:bl .5s steps(2) infinite}
.cd.pop{animation:bl .5s steps(2) infinite,pp .4s var(--ease)}
@keyframes bl{50%{opacity:.2}}
@keyframes pp{from{transform:scale(1.5)}}
.big{font-family:var(--d);text-transform:uppercase;line-height:.92;letter-spacing:-.01em;font-size:clamp(46px,min(17vw,13vh),150px)}
.big.ok{color:var(--ok)}
.big.boom{color:var(--accent);font-size:clamp(70px,28vw,200px)}
.big span{display:block;overflow:hidden;padding-top:.05em}
.big i{display:inline-block;font-style:normal;transform:translateY(105%);opacity:0;animation:up .9s var(--ease) forwards;animation-delay:calc(var(--i)*45ms)}
@keyframes up{to{transform:none;opacity:1}}
.again{padding:15px 28px;border:1px solid var(--line2);background:rgba(8,8,10,.6);backdrop-filter:blur(6px);text-transform:uppercase;letter-spacing:.2em;font-size:13px;font-weight:500;opacity:0;animation:up .8s var(--ease) 1.8s forwards;transition:border-color .3s,color .3s}
.again:active{border-color:var(--accent);color:var(--accent)}
/* final: foto casi a pantalla completa */
.ov.fin{padding:0;display:block}
.fin img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:0% 50%;animation:reveal 1.4s var(--ease) both,pan 16s ease-in-out 1.4s infinite alternate}
@keyframes reveal{from{opacity:0;transform:scale(1.12)}}
@keyframes pan{from{object-position:0% 50%}to{object-position:100% 50%}}
.fin .sh{position:absolute;left:0;right:0;pointer-events:none}
.fin .sh.t{top:0;height:42%;background:linear-gradient(rgba(8,8,10,.88),transparent)}
.fin .sh.b{bottom:0;height:26%;background:linear-gradient(transparent,rgba(8,8,10,.85))}
.fin .tt{position:absolute;left:0;right:0;top:max(26px,env(safe-area-inset-top));padding:0 5vw;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.fin .tt .big{font-size:clamp(46px,min(15vw,11vh),130px)}
.fin .again{position:absolute;left:50%;bottom:max(28px,env(safe-area-inset-bottom));margin-left:-92px;width:184px}
.fin .ring{position:absolute;left:50%;top:50%;width:20px;height:20px;border:2px solid var(--ok);border-radius:9999px;transform:translate(-50%,-50%);animation:ring 2.4s ease-out infinite;opacity:0;pointer-events:none;z-index:3}
@keyframes ring{0%{opacity:.8;width:20px;height:20px}100%{opacity:0;width:150vmax;height:150vmax}}
.rain{position:absolute;top:-30px;z-index:4;border-radius:1px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important}}

/* DESACTIVADO */
.ov.off{animation:offbg 1.4s ease-out both;gap:3vh}
@keyframes offbg{0%{background:#3a0b04}45%{background:#08080a}}
.chk{width:min(34vw,26vh);height:min(34vw,26vh);fill:none;stroke:var(--ok);stroke-width:5;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 18px rgba(61,255,154,.6))}
.chk circle{stroke-dasharray:340;stroke-dashoffset:340;transform-origin:center;transform:rotate(-90deg);animation:draw .9s var(--ease) .15s forwards}
.chk path{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .6s var(--ease) .75s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dw{font-family:var(--d);font-size:min(16.5vw,22vh);line-height:1;white-space:nowrap;text-transform:uppercase;animation:pulse 1s ease-in-out 1.6s 2}
.dw i{display:inline-block;font-style:normal;color:var(--accent);opacity:0;animation:drop 1s var(--ease) both,col 1.3s steps(1) both;animation-delay:calc(.35s + var(--i)*70ms)}
@keyframes drop{0%{transform:translateY(-110vh) rotate(-40deg) scale(2.2);opacity:0}15%{opacity:1}55%{transform:translateY(7%) rotate(5deg) scale(1)}75%{transform:translateY(-4%) rotate(-2deg)}100%{transform:none;opacity:1}}
@keyframes col{0%,70%{color:var(--accent);text-shadow:0 0 30px var(--accent)}71%,100%{color:var(--ok);text-shadow:0 0 36px rgba(61,255,154,.55)}}
@keyframes pulse{50%{transform:scale(1.06)}}
.scan{position:absolute;left:0;right:0;height:3px;background:var(--ok);box-shadow:0 0 30px 6px var(--ok);top:-3%;animation:sweep 1s ease-in .5s both}
@keyframes sweep{to{top:103%}}
.shock{position:absolute;left:50%;top:50%;width:20px;height:20px;border:2px solid var(--ok);border-radius:9999px;transform:translate(-50%,-50%);opacity:0;animation:ring 1.8s ease-out 1.1s both;pointer-events:none}
.spark{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:1px;animation:spark 1.3s cubic-bezier(.1,.8,.3,1) both;pointer-events:none}
@keyframes spark{from{transform:translate(-50%,-50%) scale(1.2);opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0) rotate(240deg);opacity:0}}
/* móvil en horizontal: todo visible y pulsable */
@media (orientation:landscape) and (max-height:700px){
  #app{max-width:none;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
  .top{padding:2px 16px}
  .clock{font-size:clamp(32px,15vh,62px)}
  .dots i{height:3px;width:22px}
  .grid{grid-template-columns:repeat(4,1fr);grid-template-rows:1fr;gap:10px}
  .tile svg{width:46%;height:46%}
  .fin .tt{display:flex;justify-content:center;gap:2.5vw;top:max(12px,env(safe-area-inset-top))}
  .fin .tt .big{font-size:clamp(32px,min(8vw,15vh),110px)}
  .fin .again{padding:11px 22px}
}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="dot"></div><div class="clock" id="clock" aria-hidden="true"><span id="mm">10</span><b>:</b><span id="ss">00</span><b>:</b><span id="cc" class="cc">00</span></div></div>
  <div class="dots" id="dots"></div>
  <div class="grid" id="grid"></div>
</div>
<div id="flash"></div>
<div class="ov" id="ov"></div>

const START_SECONDS=600;           // tiempo total (10 min). Cámbialo si quieres
const ORDER=["cuadrado","circulo","estrella","triangulo"];   // orden correcto
const LAYOUT=["triangulo","cuadrado","estrella","circulo"];  // posición en pantalla
const SYM={
  cuadrado:{svg:'<svg viewBox="0 0 100 100"><rect x="14" y="14" width="72" height="72" rx="8"/></svg>',c1:"#5aa2ff",c2:"#2f6bf0",sh:"#173a96"},
  circulo:{svg:'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="38"/></svg>',c1:"#ff7b93",c2:"#ee2d55",sh:"#8f1530"},
  estrella:{svg:'<svg viewBox="0 0 100 100"><polygon points="50,6 62,38 96,38 69,58 79,92 50,72 21,92 31,58 4,38 38,38"/></svg>',c1:"#ffe66b",c2:"#ffb300",sh:"#a56d00"},
  triangulo:{svg:'<svg viewBox="0 0 100 100"><polygon points="50,10 92,86 8,86" stroke-linejoin="round"/></svg>',c1:"#58f0b8",c2:"#14bb80",sh:"#0b7350"}
};
const $=s=>document.querySelector(s);
const grid=$("#grid"),dots=$("#dots"),ov=$("#ov"),flash=$("#flash");
let step=0,busy=false,raf,t0,deadline,lastS=-1;

/* sonido */
let ac;
function beep(f=880,d=.12,type="square",v=.06){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.state==="suspended"&&ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);
    o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}
}

/* tablero */
ORDER.forEach(k=>{const i=document.createElement("i");i.style.setProperty("--c",SYM[k].c2);dots.appendChild(i)});
LAYOUT.forEach((k,n)=>{
  const s=SYM[k],b=document.createElement("button");
  b.className="tile";b.setAttribute("aria-label",k);b.innerHTML=s.svg;
  b.style.cssText=`--c1:${s.c1};--c2:${s.c2};--sh:${s.sh};--dl:${n*.35}s`;
  b.addEventListener("pointerdown",e=>{e.preventDefault();press(k,b)});
  grid.appendChild(b);
});

/* tiempo: pasa a toda velocidad (efecto reloj acelerado) */
const SPEED=37;
function draw(){
  const total=START_SECONDS*100,el=Date.now()-t0;
  const v=((total-Math.floor(el*SPEED/10))%total+total)%total;
  $("#mm").textContent=Math.floor(v/6000);
  $("#ss").textContent=String(Math.floor(v/100)%60).padStart(2,"0");
  $("#cc").textContent=String(v%100).padStart(2,"0");
}
function loop(){
  draw();
  const sec=Math.floor((Date.now()-t0)/1000);
  if(sec!==lastS){lastS=sec;beep(300,.04,"sine",.025)}
  if(Date.now()>=deadline){boom();return}
  raf=requestAnimationFrame(loop);
}
function run(){stop();t0=Date.now();deadline=t0+START_SECONDS*1000;lastS=-1;raf=requestAnimationFrame(loop)}
function stop(){cancelAnimationFrame(raf)}
run();

function press(k,btn){
  if(busy)return;
  if(k===ORDER[step]){
    beep(660+step*160,.18,"square");
    btn.classList.add("hit");dots.children[step].classList.add("on");step++;
    if(step===4){busy=true;stop();setTimeout(countdown,600)}
  }else{
    beep(120,.5,"sawtooth",.1);busy=true;
    flash.classList.add("on");setTimeout(()=>flash.classList.remove("on"),80);
    grid.classList.remove("shake");void grid.offsetWidth;grid.classList.add("shake");
    setTimeout(()=>{reset();busy=false},700);
  }
}
function reset(){
  step=0;grid.classList.remove("shake");
  [...dots.children].forEach(d=>d.classList.remove("on"));
  [...grid.children].forEach(b=>b.classList.remove("hit"));
}

/* textos grandes letra a letra */
function big(txt,cls,off=0){
  return `<div class="big ${cls||""}">`+txt.split(" ").map(w=>`<span>${[...w].map((c,i)=>`<i style="--i:${i+off}">${c}</i>`).join("")}</span>`).join("")+`</div>`;
}

/* 3, 2, 1 */
function countdown(){
  ov.className="ov show red";ov.innerHTML='<div class="cd" id="cd"></div>';
  let n=3;
  const tick=()=>{const cd=$("#cd");cd.textContent=n;cd.classList.remove("pop");void cd.offsetWidth;cd.classList.add("pop");
    beep(1000,.25,"square",.09);
    if(n>1){n--;setTimeout(tick,1000)}else setTimeout(off,1000)};
  tick();
}
function off(){
  ov.className="ov show off";
  const w=[..."DESACTIVADO"].map((c,i)=>`<i style="--i:${i}">${c}</i>`).join("");
  ov.innerHTML='<div class="scan"></div><div class="shock"></div><div class="shock" style="animation-delay:.25s"></div><div class="shock" style="animation-delay:.5s"></div>'+
    '<svg class="chk" viewBox="0 0 120 120"><circle cx="60" cy="60" r="52"/><path d="M34 62L53 80L88 40"/></svg>'+
    `<div class="dw">${w}</div>`;
  [523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.3,"triangle",.1),600+i*130));
  setTimeout(()=>{
    const cols=["#3dff9a","#f3f1ea","#ff3b1d","#3dff9a"];
    for(let k=0;k<36;k++){
      const e=document.createElement("span");e.className="spark";
      const a=Math.random()*Math.PI*2,r=22+Math.random()*38;
      e.style.setProperty("--dx",Math.cos(a)*r+"vmin");e.style.setProperty("--dy",Math.sin(a)*r+"vmin");
      e.style.background=cols[k%4];e.style.animationDelay=Math.random()*.15+"s";
      ov.appendChild(e);
    }
  },700);
  setTimeout(final,3000);
}

/* final con la foto */
function final(){
  ov.className="ov show fin";
  ov.innerHTML=`<img alt="" src="${FOTO}"><div class="sh t"></div><div class="sh b"></div><div class="ring"></div><div class="ring" style="animation-delay:.8s"></div>`+
    '<div class="tt">'+big("Bomba","ok")+big("Desactivada","ok",5)+'</div>'+
    '<button class="again" id="again">Jugar otra vez</button>';
  $("#again").onclick=()=>{ov.className="ov";ov.innerHTML="";reset();busy=false;run()};
  [392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.4,"triangle",.1),i*150));
  const cols=["#ff3b1d","#f3f1ea","#3dff9a","#ff6a3d"];
  for(let i=0;i<60;i++){
    const e=document.createElement("span");e.className="rain";
    const w=5+Math.random()*7;e.style.width=w+"px";e.style.height=w*1.6+"px";e.style.background=cols[i%4];
    e.style.left=Math.random()*100+"vw";
    e.style.animationDuration=2.5+Math.random()*3+"s";e.style.animationDelay=Math.random()*3.5+"s";
    ov.appendChild(e);
  }
}

/* si se acaba el tiempo */
function boom(){
  busy=true;stop();ov.className="ov show red";
  ov.innerHTML=big("¡Boom!","boom")+'<button class="again" id="retry" style="animation-delay:1s">Reintentar</button>';
  [200,150,110,80].forEach((f,i)=>setTimeout(()=>beep(f,.4,"sawtooth",.12),i*120));
  $("#retry").onclick=()=>{ov.className="ov";ov.innerHTML="";reset();busy=false;run()};
}
</script>
